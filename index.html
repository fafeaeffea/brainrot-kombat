<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Брейнрот Комбат — пиксельный файтинг</title>
<script src="/sdk.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#07040a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center;font-family:Verdana,sans-serif;color:#fff}
#stage{position:relative;overflow:hidden;background:#000;box-shadow:0 0 40px #000}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:none;pointer-events:auto}
.scr.on{display:block}
#s-menu{background:none;transition:opacity .15s}
#s-menu.fade{opacity:0}
.cabscreen{position:absolute;left:7.304em;top:2.870em;width:48em;height:27em;font-size:.7667em;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.4) 40%,rgba(0,0,0,0) 60%)}
#s-menu .menu-col{left:2.4em;transform:none;top:9.4em;min-width:19em;gap:.4em}
#s-menu .btn{padding:.45em 1.2em;border-width:.2em}
#s-modes,#s-select,#s-tower,#s-moves,#s-controls,#s-settings,#s-ending{background:radial-gradient(ellipse at center,rgba(40,8,20,.82),rgba(5,2,8,.96))}
#s-pause,#s-result{background:rgba(0,0,0,.55)}
.logo{position:absolute;left:2em;top:.5em;display:flex;flex-direction:column;align-items:center;gap:.2em;filter:drop-shadow(0 0 .4em rgba(255,80,20,.6))}
.menu-col{position:absolute;left:50%;top:12.6em;transform:translateX(-50%);display:flex;flex-direction:column;align-items:stretch;gap:.35em;min-width:15em}
.menu-col.low{top:auto;bottom:.8em;flex-direction:row}
.menu-col.set{top:4.6em;min-width:26em}
.btn{display:flex;align-items:center;justify-content:center;gap:1em;padding:.2em 1em;background:linear-gradient(#3a1a24,#1e0c14);border:.2em solid #5a3040;box-shadow:inset 0 .1em 0 #6a3a4a;cursor:pointer}
.btn.foc,.btn:hover{border-color:#ffc040;background:linear-gradient(#7a2a1a,#3a0c0c);box-shadow:0 0 .8em rgba(255,150,40,.6)}
.srow{justify-content:space-between}
.stats{position:absolute;bottom:.6em;right:1em;display:flex}
.sel-title{position:absolute;top:.9em;left:0;right:0;display:flex;justify-content:center}
.side{position:absolute;top:3.2em;width:13em;display:flex;flex-direction:column;gap:.3em}
.side.left{left:.8em;align-items:flex-start}.side.right{right:.8em;align-items:flex-end}
.prev{width:10em!important;height:10em!important;box-shadow:0 0 .8em rgba(0,0,0,.8)}
.side .info{display:flex;flex-direction:column;gap:.3em;margin-top:.2em;background:rgba(0,0,0,.55);padding:.4em;align-items:inherit;align-self:stretch}
.grid{position:absolute;left:50%;top:5.2em;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.3em}
.grow{display:flex;gap:.25em}
.cell{width:3.2em;height:3.2em;display:flex;align-items:center;justify-content:center;background:#1a0c14;border:.2em solid #3a2030;cursor:pointer;position:relative}
.cell canvas{width:3em!important;height:3em!important}
.cell.p1{border-color:#ff6a3a;box-shadow:0 0 .6em #ff6a3a}
.cell.p2{border-color:#3aa8ff;box-shadow:0 0 .6em #3aa8ff}
.cell.p1.p2{border-color:#ff6a3a #3aa8ff #3aa8ff #ff6a3a}
.cell.lk{background:#5a2a10}
.glab{margin-top:.3em}
.hint{position:absolute;top:20.7em;left:50%;transform:translateX(-50%);display:flex;justify-content:center}
.backbtn{position:absolute;left:.8em;bottom:.6em}
#s-select .backbtn{left:50%;transform:translateX(-50%);bottom:.5em}
.backbtn .btn{padding:.2em .8em}
.tower{position:absolute;left:50%;top:3.4em;transform:translateX(-50%);display:flex;flex-direction:column;gap:.25em}
.trow{display:flex;align-items:center;gap:.6em;padding:0 .6em;height:2.5em;background:rgba(30,10,20,.8);border:.15em solid #3a2030;min-width:20em;position:relative}
.trow.cur{border-color:#ffc040;background:rgba(90,30,10,.85)}
.trow.done{opacity:.55}
.tme{position:absolute;right:-6.5em;display:flex;align-items:center;gap:.4em}
.rbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.6em;padding:1em 2em;background:rgba(10,4,10,.88);border:.25em solid #7a4a2a;box-shadow:0 0 2em #000}
.rbox .menu-col{position:static;transform:none}
.mtabs{position:absolute;left:.6em;top:3.6em;display:grid;grid-template-columns:repeat(3,2.65em);gap:.2em}
.mtab{padding:.05em;width:2.5em;height:2.5em;border-width:.12em}
.mtab canvas{width:2.2em!important;height:2.2em!important}
.mtab.sel{border-color:#ffc040;background:#5a2a10}
.mbody{position:absolute;left:9.2em;right:.8em;top:3.4em;bottom:.6em;display:flex;gap:.8em}
.mcol{flex:none;width:11.5em;display:flex;flex-direction:column;gap:.4em}
.mprev{width:11.25em!important;height:12em!important;flex:none;background:rgba(0,0,0,.35);border:.15em solid #3a2030}
.mlist{flex:1;display:flex;flex-direction:column;gap:.1em;overflow:hidden}
.mhead{display:flex;flex-direction:column;gap:.2em;margin-bottom:.2em}
.msec{margin-top:.25em;border-bottom:.1em solid #3a4a6a;padding-bottom:.1em}
.mrow{display:flex;justify-content:space-between;gap:1em;padding:.05em .3em;background:rgba(255,255,255,.04)}
.ctable{position:absolute;left:50%;top:3.6em;transform:translateX(-50%);display:flex;flex-direction:column;gap:.1em}
.crow{display:grid;grid-template-columns:8em 7em 7em 6em;gap:.3em;padding:.1em .5em;background:rgba(255,255,255,.05);align-items:center}
.crow .ccell{display:flex;align-items:center}
.kbtn{padding:0 .3em;border-width:.1em;height:1.2em;box-sizing:border-box}
.kbtn.wait{border-color:#ff6a3a;background:linear-gradient(#7a1a10,#3a0808);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{border-color:#ffd040}}
.backbtn.crow2{left:50%;transform:translateX(-50%);display:flex;gap:.6em;bottom:.5em}
.crow.chead{background:rgba(60,90,140,.3)}
.cnote{position:absolute;left:0;right:0;bottom:3.3em;display:flex;justify-content:center}
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
.stick{position:absolute;left:1.2em;bottom:1.2em;width:8em;height:8em;border-radius:50%;background:rgba(255,255,255,.08);border:.2em solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:rgba(255,200,120,.45);border:.15em solid rgba(255,255,255,.5)}
.tbtns{position:absolute;right:1em;bottom:1em;width:13em;height:11em;pointer-events:none}
.tb{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(160,40,30,.45);border:.2em solid rgba(255,220,160,.5);pointer-events:auto;touch-action:none}
.tb.dn{background:rgba(255,160,60,.7)}
.tp{width:4em;height:4em;right:4.6em;bottom:.2em}
.tk{width:4em;height:4em;right:0;bottom:2.8em}
.tbk{width:3.4em;height:3.4em;right:8.8em;bottom:.4em;background:rgba(40,80,160,.45)}
.ts1,.ts2{width:4.6em;height:2.2em;border-radius:1em;background:rgba(120,40,160,.45)}
.ts1{right:5em;bottom:5em}.ts2{right:0;bottom:7.5em}.ts3{right:9.6em;bottom:4.4em;width:4.6em;height:2.2em;border-radius:1em;background:rgba(200,140,20,.5)}
.tfat{width:7em;height:2.4em;border-radius:1em;right:14em;bottom:1em;background:rgba(200,0,0,.6)}
.tpause{position:absolute;left:50%;top:2.6em;transform:translateX(-50%);width:2.4em;height:2.4em;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border:.15em solid rgba(255,255,255,.3);pointer-events:auto}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:#07040a;font-weight:bold;letter-spacing:.2em;color:#ffb030;font-size:2em}
#loading .b{width:10em;height:.4em;background:#2a1018;border:2px solid #5a3040}
#loadbar{height:100%;width:0;background:linear-gradient(90deg,#c01010,#ffd040)}
.mhead2{position:absolute;top:.7em;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:.4em}
.mcards{position:absolute;left:50%;top:5.4em;transform:translateX(-50%);display:flex;gap:1em}
.mcard{flex-direction:column;gap:.5em;padding:.5em .5em .7em;width:13.4em;justify-content:flex-start}
.mart{width:12.8em!important;height:9.6em!important;border:.1em solid #000}
.mcard.foc{transform:translateY(-.3em)}
.mbtns{position:absolute;left:50%;bottom:.9em;transform:translateX(-50%);display:flex;gap:.6em}
.hudbtns{position:absolute;left:50%;bottom:.5em;transform:translateX(-50%);display:none;gap:.4em;pointer-events:auto;z-index:5}
.hudbtns.on{display:flex}
.hbtn{padding:.25em .6em;background:rgba(10,4,12,.7);border:.12em solid rgba(255,208,64,.55);cursor:pointer}
.hbtn:hover{background:rgba(90,30,20,.85)}
.aprev{position:absolute;left:50%;top:3.6em;transform:translateX(-50%);width:24em!important;height:13.5em!important;border:.2em solid #c08a30;box-shadow:0 0 1em rgba(0,0,0,.8)}
.aname{position:absolute;left:50%;top:15.6em;transform:translateX(-50%);display:flex;background:rgba(0,0,0,.6);padding:.2em .8em}
.agrid{position:absolute;left:50%;top:18.1em;transform:translateX(-50%);display:grid;grid-template-columns:repeat(8,4.6em);gap:.3em}
.acell{padding:0;width:4.6em;height:2.6em;border-width:.15em}
.acell canvas{width:100%!important;height:100%!important}
.acell.sel{border-color:#ffd040;box-shadow:0 0 .5em #ffd040}
#s-arena{background:rgba(6,2,10,.82)}
#s-arena .backbtn{bottom:.4em}
.adiff{position:absolute;right:.8em;top:4.2em;flex-direction:column;gap:.35em;align-items:stretch;width:10em}
.dbtn{display:flex;justify-content:center;padding:.4em .3em;background:linear-gradient(#3a1a24,#1e0c14);border:.15em solid #5a3040;cursor:pointer}
.dbtn.on{border-color:#ffd040;box-shadow:0 0 .5em #ffd040;background:#5a2a10}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="ui"></div>
  <div id="touch"></div>
  <div id="loading"><div>БРЕЙНРОТ КОМБАТ</div><div class="b"><div id="loadbar"></div></div></div>
</div>
<script src="js/util.js"></script>
<script src="js/render.js"></script>
<script src="js/chars.js"></script>
<script src="js/anims.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/fighter.js"></script>
<script src="js/unique.js"></script>
<script src="js/heroines.js"></script>
<script src="js/ai.js"></script>
<script src="js/stages.js"></script>
<script src="js/fatality.js"></script>
<script src="js/cabinet.js"></script>
<script src="js/ya.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
